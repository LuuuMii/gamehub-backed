server:
  port: 8888
spring:
  application:
    name: blog-backed
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    expire: 60000 # 自定义属性
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:com/cmc/mapper/xml/*.xml
  type-aliases-package: com.cmc.entity
  # configuration:
  #   map-underscore-to-camel-case: false

logging:
  level:
    com.manong.dao: debug

# 自定义属性相关配置
request:
  login:
    url: /user/login

jwt:
  secret: XiaoHeMiaoYa
  expiration: 604800000

# sa-token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 阿里云 OSS 配置
aliyun:
  oss:
    file:
      endpoint: oss-cn-hangzhou.aliyuncs.com
      keyId: ${ALIYUN_KEYID}
      keySecret: ${ALIYUN_KEYSECRET}
      bucketName: cmc-blog
      region: cn-hangzhou

token:
  prefix: token

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: my-producer-group
  consumer:
    group: my-producer-group

myBlog:
  column:
    defaultCoverImg: https://cmc-blog.oss-cn-hangzhou.aliyuncs.com/articleImg/25dd157c-c944-47b8-b2db-ac58e04d95f8_xiaohemiao.jpg